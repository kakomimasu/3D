<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="theme-color" content="#102124">
    <title>囲みマス 3D</title>
    <meta name="description" content="囲みマスの公開対戦を3Dで観戦。盤面を自由に回転・拡大しながら、対戦者の動きや得点を楽しめるブラウザビューアです。">
    <link rel="canonical" href="https://kakomimasu.github.io/3D/">
    <meta property="og:type" content="website">
    <meta property="og:locale" content="ja_JP">
    <meta property="og:site_name" content="囲みマス 3D">
    <meta property="og:title" content="囲みマス 3D">
    <meta property="og:description" content="囲みマスの公開対戦を3Dで観戦。盤面を自由に回転・拡大しながら、対戦者の動きや得点を楽しめるブラウザビューアです。">
    <meta property="og:url" content="https://kakomimasu.github.io/3D/">
    <meta property="og:image" content="https://kakomimasu.github.io/3D/img/ogp.png">
    <meta property="og:image:type" content="image/png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="囲みマス 3Dの対戦画面。立体盤面、得点ボード、選手席と観客席。">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="囲みマス 3D">
    <meta name="twitter:description" content="囲みマスの公開対戦を3Dで観戦。盤面を自由に回転・拡大しながら、対戦者の動きや得点を楽しめるブラウザビューアです。">
    <meta name="twitter:image" content="https://kakomimasu.github.io/3D/img/ogp.png">
    <meta name="twitter:image:alt" content="囲みマス 3Dの対戦画面。立体盤面、得点ボード、選手席と観客席。">
    <link rel="icon" type="image/svg+xml" href="/img/kakomimasu-logo.svg">
  </head>
  <body>
    <main>
      <header>
        <a class="brand"
          href="./"><img class="official-logo" src="/img/kakomimasu-logo.svg" alt="囲みマス"><b class="brand-edition">3D</b></a>
        <span id="connection" role="status">接続中…</span>
        <button id="open-games">ゲーム一覧</button>
      </header>
      <section class="stage" aria-label="3Dスタジオ">
        <canvas id="scene"
          aria-label="回転・拡大できる囲みマスの3D盤面"></canvas>
        <div class="stage-top">
          <details class="options">
            <summary>操作</summary>
            <div class="options-panel">
              <label><input id="auto-camera" type="checkbox" checked> カメラを自動で動かす</label>
              <label><input id="numbers" type="checkbox" checked> マスの得点を表示</label>
              <button id="demo">デモに切り替え</button>
              <div
                class="controls"><button id="play">▶ デモを再生</button><button id="step" aria-label="デモを1ターン進める">1ターン進む →</button></div>
              <small>デモは表示確認用のサンプルです。</small>
            </div>
          </details>
          <div class="view-controls" aria-label="視点切り替え">
        <button id="studio" class="active">スタジオ</button><button id="players">選手席</button><button id="angle">盤面</button><button id="top">真上</button><button id="reset" aria-label="カメラを初期位置に戻す">↺</button>
      </div>
        </div>
        <div
          class="stage-bottom"><p id="message" aria-live="polite"></p><div id="tile-info">マスにカーソルを合わせると詳細を表示</div><span class="hint">ドラッグで回転 ／ スクロールで拡大 ／ 右ドラッグで移動</span></div>
        <div class="commentary-caption" id="commentary-caption" role="status"
          aria-live="polite"></div>
        <p id="score-summary" class="sr-only" aria-live="polite"></p>
        <div id="fatal" hidden></div>
      </section>
    </main>
    <dialog id="games-dialog" aria-labelledby="games-heading">
      <div
        class="games-header"><h2 id="games-heading">ゲーム一覧</h2><button id="close-games" aria-label="ゲーム一覧を閉じる">✕</button></div>
      <form
        id="connect"><label for="game-id">対戦IDを指定</label><div class="input-row"><input id="game-id" placeholder="対戦IDを入力" aria-label="対戦ID" required maxlength="200"><button type="submit">接続</button></div></form>
      <div
        class="games-toolbar"><p>最近の公開対戦</p><button id="refresh-games">更新</button></div>
      <p id="games-status" role="status"></p>
      <div id="games-list" aria-label="公開対戦一覧"></div>
    </dialog>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
